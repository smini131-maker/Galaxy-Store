name: Upgrade Galaxy Store automation to v1.2.1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/upgrade-v121.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.2.1 patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -dc > /tmp/v121.patch
          git apply --check /tmp/v121.patch
          git apply /tmp/v121.patch
          rm -f .github/workflows/upgrade-v121.yml

      - name: Commit v1.2.1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: WebView diagnostics and scrolling v1.2.1"
          git push
