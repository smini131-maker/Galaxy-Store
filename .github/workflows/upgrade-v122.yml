name: Upgrade Galaxy Store automation to v1.2.2

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/upgrade-v122.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.2.2 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          service = Path('app/src/main/java/com/smini/galaxyattendance/AttendanceAccessibilityService.kt')
          s = service.read_text()
          s = s.replace('자동 탐색 세션 시작 (WebView 정밀진단 v1.2.1)', '자동 탐색 세션 시작 (WebView 스크롤 보강 v1.2.2)')
          s = s.replace('scrollForward("혜택 화면")', 'scrollForward(root, "혜택 화면")')
          s = s.replace('scrollForward("출석 페이지")', 'scrollForward(root, "출석 페이지")')

          new_scroll = '''    private fun scrollForward(root: AccessibilityNodeInfo?, where: String): Boolean {
              AppLog.write(this, "[$where 스크롤] 스크롤 시도")

              val scrollableNode = root?.let { findScrollableNode(it) }
              if (scrollableNode != null) {
                  val rect = Rect().also { scrollableNode.getBoundsInScreen(it) }
                  val className = scrollableNode.className?.toString().orEmpty()
                  AppLog.write(
                      this,
                      "[$where 스크롤] 네이티브 후보 class='$className' bounds=$rect visible=${scrollableNode.isVisibleToUser}"
                  )

                  val forward = scrollableNode.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD)
                  AppLog.write(this, "[$where 스크롤] ACTION_SCROLL_FORWARD=${if (forward) "success" else "failed"}")
                  if (forward) return true

                  val down = scrollableNode.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_SCROLL_DOWN.id)
                  AppLog.write(this, "[$where 스크롤] ACTION_SCROLL_DOWN=${if (down) "success" else "failed"}")
                  if (down) return true
              } else {
                  AppLog.write(this, "[$where 스크롤] isScrollable=true 노드를 찾지 못함")
              }

              val metrics = resources.displayMetrics
              val x = metrics.widthPixels / 2f
              val startY = metrics.heightPixels * SCROLL_START_RATIO
              val endY = metrics.heightPixels * SCROLL_END_RATIO

              AppLog.write(
                  this,
                  "[$where 스크롤] 제스처 폴백 X=${x.toInt()} Y=${startY.toInt()}→${endY.toInt()} duration=${SCROLL_DURATION_MS}ms"
              )

              val path = Path().apply {
                  moveTo(x, startY)
                  lineTo(x, endY)
              }

              val gesture = GestureDescription.Builder()
                  .addStroke(GestureDescription.StrokeDescription(path, 0, SCROLL_DURATION_MS))
                  .build()

              val accepted = dispatchGesture(gesture, null, null)
              AppLog.write(this, "[$where 스크롤] 제스처 dispatch=${if (accepted) "accepted" else "rejected"}")
              return accepted
          }

          private fun findScrollableNode(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
              val candidates = allNodes(root).mapNotNull { node ->
                  if (!node.isScrollable || !node.isVisibleToUser || !node.isEnabled) return@mapNotNull null
                  val rect = Rect().also { node.getBoundsInScreen(it) }
                  if (rect.isEmpty || !isRectOnScreen(rect)) return@mapNotNull null
                  ScrollCandidate(node, rect)
              }

              if (candidates.isEmpty()) return null

              return candidates.maxWithOrNull(
                  compareBy<ScrollCandidate> { scrollClassPriority(it.node.className?.toString().orEmpty()) }
                      .thenBy { it.rect.height() }
              )?.node
          }

          private fun scrollClassPriority(className: String): Int {
              val name = className.lowercase(Locale.ROOT)
              return when {
                  "webview" in name -> 4
                  "scrollview" in name -> 3
                  "recyclerview" in name || "listview" in name -> 2
                  else -> 1
              }
          }

          private data class ScrollCandidate(
              val node: AccessibilityNodeInfo,
              val rect: Rect
          )
          '''

          pattern = r'    private fun scrollForward\(where: String\): Boolean \{.*?\n    \}\n\n    private fun gestureClick'
          replacement = new_scroll + '\n    private fun gestureClick'
          s2, count = re.subn(pattern, replacement, s, flags=re.S)
          if count != 1:
              raise SystemExit(f'scrollForward replacement count={count}')
          s = s2
          s = s.replace(
              '        private const val SCROLL_DURATION_MS = 600L',
              '        private const val SCROLL_DURATION_MS = 250L\n        private const val SCROLL_START_RATIO = 0.70f\n        private const val SCROLL_END_RATIO = 0.30f'
          )
          service.write_text(s)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text().replace('versionCode = 4', 'versionCode = 5').replace('versionName = "1.2.1"', 'versionName = "1.2.2"')
          gradle.write_text(g)

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace('**v1.2.1** — WebView 출석 버튼 탐색과 Bounds/스크롤 진단을 강화한 버전입니다.', '**v1.2.2** — WebView 네이티브 스크롤 우선 + 안전 구역 제스처 폴백 버전입니다.')
          if '## v1.2.2 WebView 스크롤 보강' not in r:
              r += '''\n\n## v1.2.2 WebView 스크롤 보강\n- `isScrollable=true`인 WebView/ScrollView를 찾아 `ACTION_SCROLL_FORWARD`를 1순위로 수행합니다.\n- 필요 시 `ACTION_SCROLL_DOWN`도 시도합니다.\n- 네이티브 스크롤 실패 시 화면 높이 70% → 30%를 250ms로 스와이프합니다.\n- 하단 내비게이션/삼성페이 영역과의 충돌 및 WebView 롱프레스 오인을 줄였습니다.\n- 내부 로그에 스크롤 후보 클래스/Bounds, 네이티브 액션 성공 여부, 제스처 폴백 결과를 남깁니다.\n'''
          readme.write_text(r)

          workflow = Path('.github/workflows/build.yml')
          w = workflow.read_text().replace('v1.2.1-debug', 'v1.2.2-debug').replace('v1.2.1-project', 'v1.2.2-project')
          workflow.write_text(w)
          PY

          rm -f .github/workflows/upgrade-v122.yml

      - name: Commit v1.2.2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/smini/galaxyattendance/AttendanceAccessibilityService.kt app/build.gradle.kts README.md .github/workflows/build.yml .github/workflows/upgrade-v122.yml
          git commit -m "feat: v1.2.2 native WebView scroll fallback"
          git push
