name: Upgrade Galaxy Store automation to v1.2.3

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/upgrade-v123.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.2.3 scroll patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          service = Path('app/src/main/java/com/smini/galaxyattendance/AttendanceAccessibilityService.kt')
          s = service.read_text()
          s = s.replace(
              '자동 탐색 세션 시작 (WebView 스크롤 보강 v1.2.2)',
              '자동 탐색 세션 시작 (WebView 강제 스크롤 v1.2.3)'
          )

          new_scroll = '''    private fun scrollForward(root: AccessibilityNodeInfo?, where: String): Boolean {
              AppLog.write(this, "[$where 스크롤] 강제 스크롤 시도")

              // 1순위: WebView 자체에 직접 접근성 스크롤 액션을 전달한다.
              // 일부 Galaxy Store WebView는 isScrollable=false로 노출돼도 액션을 받을 수 있어
              // isScrollable 조건 없이 보이는 WebView를 모두 확인한다.
              if (root != null) {
                  val webViews = allNodes(root).filter { node ->
                      val className = node.className?.toString().orEmpty()
                      if (className != "android.webkit.WebView" || !node.isVisibleToUser || !node.isEnabled) {
                          return@filter false
                      }
                      val rect = Rect().also { node.getBoundsInScreen(it) }
                      !rect.isEmpty && isRectOnScreen(rect)
                  }

                  for ((index, webView) in webViews.withIndex()) {
                      val rect = Rect().also { webView.getBoundsInScreen(it) }
                      AppLog.write(
                          this,
                          "[$where 스크롤] WebView 후보 ${index + 1}/${webViews.size} bounds=$rect scrollable=${webView.isScrollable}"
                      )

                      val forward = webView.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD)
                      AppLog.write(
                          this,
                          "[$where 스크롤] WebView ACTION_SCROLL_FORWARD=${if (forward) "success" else "failed"}"
                      )
                      if (forward) return true

                      val down = webView.performAction(
                          AccessibilityNodeInfo.AccessibilityAction.ACTION_SCROLL_DOWN.id
                      )
                      AppLog.write(
                          this,
                          "[$where 스크롤] WebView ACTION_SCROLL_DOWN=${if (down) "success" else "failed"}"
                      )
                      if (down) return true
                  }

                  if (webViews.isEmpty()) {
                      AppLog.write(this, "[$where 스크롤] 화면 안의 WebView 노드를 찾지 못함")
                  }
              }

              // 2순위: S25 Ultra의 상/하단 시스템 제스처 영역을 피한 중앙 안전 구역에서
              // 짧고 명확한 물리 스와이프를 보낸다.
              val metrics = resources.displayMetrics
              val x = metrics.widthPixels / 2f
              val startY = metrics.heightPixels * SCROLL_START_RATIO
              val endY = metrics.heightPixels * SCROLL_END_RATIO

              AppLog.write(
                  this,
                  "[$where 스크롤] 중앙 제스처 폴백 X=${x.toInt()} Y=${startY.toInt()}→${endY.toInt()} duration=${SCROLL_DURATION_MS}ms"
              )

              val path = Path().apply {
                  moveTo(x, startY)
                  lineTo(x, endY)
              }
              val gesture = GestureDescription.Builder()
                  .addStroke(GestureDescription.StrokeDescription(path, 0, SCROLL_DURATION_MS))
                  .build()

              val accepted = dispatchGesture(gesture, null, null)
              AppLog.write(
                  this,
                  "[$where 스크롤] 중앙 제스처 dispatch=${if (accepted) "accepted" else "rejected"}"
              )
              return accepted
          }
'''

          pattern = r'    private fun scrollForward\(root: AccessibilityNodeInfo\?, where: String\): Boolean \{.*?\nprivate data class ScrollCandidate\(\n    val node: AccessibilityNodeInfo,\n    val rect: Rect\n\)\n'
          s2, count = re.subn(pattern, new_scroll, s, flags=re.S)
          if count != 1:
              raise SystemExit(f'scroll block replacement count={count}')
          s = s2
          s = s.replace('private const val SCROLL_DURATION_MS = 250L', 'private const val SCROLL_DURATION_MS = 200L')
          s = s.replace('private const val SCROLL_START_RATIO = 0.70f', 'private const val SCROLL_START_RATIO = 0.65f')
          s = s.replace('private const val SCROLL_END_RATIO = 0.30f', 'private const val SCROLL_END_RATIO = 0.35f')
          service.write_text(s)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('versionCode = 5', 'versionCode = 6')
          g = g.replace('versionName = "1.2.2"', 'versionName = "1.2.3"')
          gradle.write_text(g)

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace(
              '**v1.2.2** — WebView 네이티브 스크롤 우선 + 안전 구역 제스처 폴백 버전입니다.',
              '**v1.2.3** — WebView 직접 스크롤 + S25 Ultra 중앙 안전구역 200ms 스와이프 버전입니다.'
          )
          if '## v1.2.3 강제 스크롤 보강' not in r:
              r += '''\n\n## v1.2.3 강제 스크롤 보강\n- 화면에 보이는 `android.webkit.WebView`를 `isScrollable` 값과 무관하게 직접 탐색합니다.\n- 각 WebView에 `ACTION_SCROLL_FORWARD`, `ACTION_SCROLL_DOWN`을 순서대로 직접 전달합니다.\n- 네이티브 액션이 실패하면 S25 Ultra의 상/하단 시스템 제스처 영역을 피한 화면 중앙 65% → 35% 구간을 200ms로 스와이프합니다.\n- 기존 v1.2.2의 Bounds/유령 노드 차단, 분할 텍스트 결합, 성공 문구 검증은 유지합니다.\n- 제안된 `0.95f` 하단 컷은 화면 안에 보이는 버튼까지 제외할 수 있어 적용하지 않고 기존 화면 교차/중심점 Bounds 검사를 유지합니다.\n'''
          readme.write_text(r)
          PY

      - name: Commit v1.2.3 app changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/smini/galaxyattendance/AttendanceAccessibilityService.kt app/build.gradle.kts README.md
          git commit -m "feat: v1.2.3 force WebView scroll on Galaxy S25 Ultra"
          git push
