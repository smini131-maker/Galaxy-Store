name: Build Galaxy Store Auto Attendance APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate standard Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Persist Gradle Wrapper in repository
        shell: bash
        run: |
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.jar
          if ! git diff --cached --quiet; then
            git commit -m "chore: add standard Gradle wrapper [skip ci]"
            git push
          fi

      - name: Build debug APK through wrapper
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyStoreAutoAttendance-v1.3.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload complete Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyStoreAutoAttendance-v1.3.1-project
          path: |
            **
            !.git/**
            !.gradle/**
            !app/build/**
          if-no-files-found: error
          retention-days: 7
