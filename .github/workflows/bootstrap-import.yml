name: Bootstrap project import

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          cat .bootstrap/chunk_* > /tmp/project.zip.b64
          base64 -d /tmp/project.zip.b64 > /tmp/project.zip
          unzip -t /tmp/project.zip
          unzip -o /tmp/project.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit imported Android project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Galaxy Store Auto Attendance v1.2.0"
          git push
