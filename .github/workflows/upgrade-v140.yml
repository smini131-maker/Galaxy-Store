name: Upgrade Galaxy Store automation to v1.4.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/upgrade-v140.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.4.0 service patch
        run: python3 tools/upgrade_v140_service.py

      - name: Commit service changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/smini/galaxyattendance/AttendanceAccessibilityService.kt
          git commit -m "fix: v1.4.0 prevent event title from masquerading as attendance button"
          git push
